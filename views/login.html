<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .badge { background: #e2e8f0; padding: 5px; border-radius: 4px; font-size: 12px; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Ingreso al Sistema</h2>
        <p>Usa: <strong>admin@correo.com</strong></p>
        <form action="/api/login" method="POST">
            <input type="email" name="email" placeholder="Correo electrónico" required>
            <button type="submit">Ingresar</button>
        </form>
        <div class="badge" id="info-puerto">Cargando puerto...</div>
    </div>

    <script>
        fetch('/api/info')
            .then(res => res.json())
            .then(data => {
                document.getElementById('info-puerto').innerText = `Atendido por puerto: ${data.puerto}`;
            });
    </script>
</body>
</html>
